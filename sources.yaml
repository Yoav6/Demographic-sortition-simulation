  - id: oecd_piaac_2023_tables
    title:
      en: OECD Survey of Adult Skills (PIAAC) 2023 - annex tables of chapters 2 and 3 (all participating countries, including Israel)
      he: סקר מיומנויות הבוגרים של ה-OECD (PIAAC) 2023 - לוחות הנספח לפרקים 2 ו-3 (כל המדינות המשתתפות, כולל ישראל)
    publisher: OECD
    tier: A
    url: https://www.oecd.org/en/publications/survey-of-adults-skills-2023-country-notes_ab4f6b8c-en/israel_3915a641-en.html
    license: OECD terms and conditions (reuse with attribution)
    as_of: 2022-23 (data collection)
    used_by: [literacy_level]
    files:
      - url: https://stat.link/files/b263dc5d-en/eb8dxq.xlsx
        path: piaac_2023_chapter2_tables.xlsx
      - url: https://stat.link/files/b263dc5d-en/owiypl.xlsx
        path: piaac_2023_chapter3_tables.xlsx
    notes: >
      StatLink workbooks of "Do Adults Have the Skills They Need to Thrive in a Changing World?
      Survey of Adult Skills 2023". Israel's sample: 6,092 adults aged 16-65 (61% response rate),
      assessed in Hebrew or Arabic. Used: literacy mean, standard deviation and percentiles
      (A.2.1), proficiency levels (A.2.2), by age (A.2.4), education (A.2.5), gender (A.2.7), and
      education by age (A.3.11).

