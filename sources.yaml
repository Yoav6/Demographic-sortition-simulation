# Source registry for popsim.
#
# Every number in the model traces back to an entry here. `popsim fetch` downloads
# tier A/M files into data/raw/<id>/ and pins their sha256 in sources.lock.json.
# Tiers: A scripted download · B headless browser · C free registration (optional)
#        M manual transcription · R restricted microdata (aggregates only)
# Which model nodes use a source is read from model/dag.yaml; `used_by` here lists nodes a
# source is *planned* for. SOURCES.md is generated from this file.

sources:

  - id: cbs_localities_2024
    title:
      en: CBS localities file 2024 ("bycode")
      he: קובץ היישובים 2024 של הלמ"ס
    publisher: Central Bureau of Statistics (CBS)
    tier: A
    url: https://www.cbs.gov.il/he/publications/Pages/2019/%D7%99%D7%99%D7%A9%D7%95%D7%91%D7%99%D7%9D-%D7%91%D7%99%D7%A9%D7%A8%D7%90%D7%9C.aspx
    license: CBS publication; reuse with attribution
    as_of: 2024-12-31
    used_by: [frame, locality]
    files:
      - url: https://www.cbs.gov.il/he/publications/doclib/2019/ishuvim/bycode2024.xlsx
        path: bycode2024.xlsx
    notes: >
      One row per locality: CBS code, Hebrew/English name, district, sub-district,
      natural region, municipal status, religion of the locality, population (total,
      Jews and others, Jews, Arabs), coordinates.

