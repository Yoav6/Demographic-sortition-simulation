  - id: cbs_social_survey_2024
    title:
      en: CBS Social Survey 2024 - custom cross-tabulations from the official table generator (persons aged 20+)
      he: הסקר החברתי 2024 של הלמ"ס - הצלבות מותאמות ממחולל הלוחות הרשמי (בני 20 ומעלה)
    publisher: Central Bureau of Statistics (CBS) - Social Survey
    tier: B
    url: https://boardsgenerator.cbs.gov.il/pages/Seker/wizardpage.aspx
    license: CBS publication (online table generator); reuse with attribution
    as_of: 2024
    used_by: [marital_status, children, education, military_service, labour_status, occupation, industry, work_status, income, household_income, home_ownership, health, disability, internet]
    manual: [cbs_ss/]
    notes: >
      Weighted frequencies (persons) with relative standard errors, queried through the generator's
      own JSON handlers inside a headless browser (`popsim fetch-cbs-ss`). Each table's query spec
      is in data/manual/cbs_ss/queries/<id>.json and the result in data/manual/cbs_ss/<id>.csv.
      Variable and category codes: data/manual/cbs_ss/variables_2024.json. Arab tables exclude the
      Jerusalem district, whose Arab residents are mostly not citizens.
