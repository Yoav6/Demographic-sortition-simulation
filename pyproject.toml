[project]
name = "popsim"
version = "0.1.0"
description = "Data pipeline for simulating a sortition assembly of Israeli citizens"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "playwright>=1.47",
  "pyproj>=3.8.0",
  "pyreadstat>=1.2",
  "pyyaml>=6.0",
  "statsmodels>=0.14",
  "xlrd>=2.0",
]

[project.scripts]
popsim = "popsim.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/popsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
