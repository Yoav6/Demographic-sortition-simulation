  - id: income_amount
    type: interval
    parent: income
    label: {en: Gross monthly earnings from work (₪), he: 'הכנסה חודשית ברוטו מעבודה (ש"ח)'}
    file: cpts/income_amount.csv
    doc: docs/methodology/income.md
    sources: [cbs_social_survey_2024]
    scale: log
    round: 100
    # open top bracket: Pareto tail above ₪21,000 (see docs/methodology/income.md)
    tail_alpha: 3
    tail_u_max: 0.999
    # earnings cannot exceed the household's income bracket
    cap_by: household_income

  - id: income_percentile
    type: percentile
    parent: income_amount
    label: {en: Earnings percentile among employed citizens, he: אחוזון ההכנסה מעבודה בקרב המועסקים}
    file: cpts/income_percentile.csv
    doc: docs/methodology/income.md
    sources: [cbs_social_survey_2024]

  - id: household_income_amount
    type: interval
    parent: household_income
    label: {en: Household gross monthly income (₪), he: 'הכנסה חודשית ברוטו של משק הבית (ש"ח)'}
    file: cpts/household_income_amount.csv
    doc: docs/methodology/household_income.md
    sources: [cbs_social_survey_2024]
    scale: log
    round: 100
    # open top bracket: Pareto tail above ₪24,000 (see docs/methodology/household_income.md)
    tail_alpha: 2.5
    tail_u_max: 0.999
    # household income is at least the person's own earnings
    floor_by: income_amount

