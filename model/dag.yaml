# The popsim model: a Bayesian network of conditional probability tables.
#
# Nodes are listed in sampling order; every parent must appear above its child.
# Labels: en, he (masculine/neutral) and he_f (feminine, when different).
# Each node's distribution file is written by `popsim build`; its methodology is
# documented in docs/methodology/<doc>.md (checked by `popsim docs --check`).

version: 2026.10.0
reference_date: 2024-12-31
population:
  label:
    en: Israeli citizens aged 18 and over living in Israel
    he: אזרחי ישראל בני 18 ומעלה המתגוררים בישראל

nodes:

  - id: frame
    type: frame
    label: {en: Population frame, he: מסגרת האוכלוסייה}
    file: frame.csv
    doc: docs/methodology/frame.md
    sources: [cbs_localities_2024, cbs_local_authorities_2024, cbs_abstract_2025_population, cec_knesset25]
    vars:
      - id: locality
        label: {en: Place of residence, he: מקום מגורים}
        domain_file: domains/locality.csv
      - id: group
        label: {en: Population group (registered religion), he: קבוצת אוכלוסייה (דת רשומה)}
        values:
          - id: jewish
            label: {en: Jewish, he: יהודי, he_f: יהודייה}
          - id: muslim
            label: {en: Muslim, he: מוסלמי, he_f: מוסלמית}
          - id: christian_arab
            label: {en: Arab Christian, he: נוצרי ערבי, he_f: נוצרייה ערבייה}
          - id: druze
            label: {en: Druze, he: דרוזי, he_f: דרוזית}
          - id: other
            label: {en: Not registered as Jewish or Arab, he: לא רשום כיהודי או כערבי, he_f: לא רשומה כיהודייה או כערבייה}
      - id: sex
        label: {en: Sex, he: מין}
        values:
          - id: male
            label: {en: Man, he: גבר}
          - id: female
            label: {en: Woman, he: אישה}
      - id: age_band
        label: {en: Age group, he: קבוצת גיל}
        values:
          - {id: 18-19, label: {en: 18-19, he: 18-19}}
          - {id: 20-24, label: {en: 20-24, he: 20-24}}
          - {id: 25-29, label: {en: 25-29, he: 25-29}}
          - {id: 30-34, label: {en: 30-34, he: 30-34}}
          - {id: 35-39, label: {en: 35-39, he: 35-39}}
          - {id: 40-44, label: {en: 40-44, he: 40-44}}
          - {id: 45-49, label: {en: 45-49, he: 45-49}}
          - {id: 50-54, label: {en: 50-54, he: 50-54}}
          - {id: 55-59, label: {en: 55-59, he: 55-59}}
          - {id: 60-64, label: {en: 60-64, he: 60-64}}
          - {id: 65-69, label: {en: 65-69, he: 65-69}}
          - {id: 70-74, label: {en: 70-74, he: 70-74}}
          - {id: 75-79, label: {en: 75-79, he: 75-79}}
          - {id: 80-84, label: {en: 80-84, he: 80-84}}
          - {id: 85+, label: {en: 85+, he: 85+}}

  - id: district
    type: lookup
    parent: locality
    label: {en: District, he: מחוז}
    file: lookups/district.csv
    doc: docs/methodology/frame.md
    sources: [cbs_localities_2024]
    values:
      - {id: jerusalem, label: {en: Jerusalem District, he: מחוז ירושלים}}
      - {id: north, label: {en: Northern District, he: מחוז הצפון}}
      - {id: haifa, label: {en: Haifa District, he: מחוז חיפה}}
      - {id: center, label: {en: Central District, he: מחוז המרכז}}
      - {id: tel_aviv, label: {en: Tel Aviv District, he: מחוז תל אביב}}
      - {id: south, label: {en: Southern District, he: מחוז הדרום}}
      - {id: judea_samaria, label: {en: Judea and Samaria (West Bank), he: אזור יהודה ושומרון}}

  - id: locality_type
    type: lookup
    parent: locality
    label: {en: Type of locality, he: סוג יישוב}
    file: lookups/locality_type.csv
    doc: docs/methodology/frame.md
    sources: [cbs_localities_2024]
    values:
      - {id: large_city, label: {en: "city of 100,000+", he: "עיר של 100,000 תושבים ומעלה"}}
      - {id: city, label: {en: "city of 20,000-100,000", he: "עיר של 20,000-100,000 תושבים"}}
      - {id: town, label: {en: small town, he: עיירה}}
      - {id: arab_city, label: {en: Arab city, he: עיר ערבית}}
      - {id: arab_town, label: {en: Arab town or village, he: יישוב ערבי}}
      - {id: moshav, label: {en: moshav, he: מושב}}
      - {id: kibbutz, label: {en: kibbutz, he: קיבוץ}}
      - {id: community, label: {en: community settlement, he: יישוב קהילתי}}
      - {id: bedouin_tribe, label: {en: Bedouin tribe (unrecognised or dispersed locality), he: שבט בדואי (פזורה)}}
      - {id: rural_other, label: {en: other rural locality, he: יישוב כפרי אחר}}
      - {id: other, label: {en: other, he: אחר}}

  - id: locality_profile
    type: lookup
    parent: locality
    hidden: true
    label: {en: Religiosity profile of the locality, he: פרופיל דתיות של היישוב}
    file: lookups/locality_profile.csv
    domain_file: domains/locality_profile.csv
    doc: docs/methodology/religiosity.md
    sources: [cec_knesset25, ines_2022]

  - id: sector
    type: table
    parents: [group, locality]
    backoff: [locality]
    label: {en: Sector, he: מגזר}
    file: cpts/sector.csv
    doc: docs/methodology/frame.md
    sources: [cbs_localities_2024]
    values:
      - id: jewish
        label: {en: Jewish, he: יהודי, he_f: יהודייה}
        attrs:
          noun: {en: Jewish, he: היהודי}
      - id: arab_muslim
        label: {en: Arab Muslim, he: ערבי מוסלמי, he_f: ערבייה מוסלמית}
        attrs:
          noun: {en: Arab Muslim, he: הערבי-מוסלמי}
      - id: bedouin
        label: {en: Bedouin, he: בדואי, he_f: בדואית}
        attrs:
          noun: {en: Bedouin, he: הבדואי}
      - id: circassian
        label: {en: Circassian, he: צ'רקסי, he_f: צ'רקסית}
        attrs:
          noun: {en: Circassian, he: הצ'רקסי}
      - id: arab_christian
        label: {en: Arab Christian, he: ערבי נוצרי, he_f: ערבייה נוצרייה}
        attrs:
          noun: {en: Arab Christian, he: הערבי-נוצרי}
      - id: druze
        label: {en: Druze, he: דרוזי, he_f: דרוזית}
        attrs:
          noun: {en: Druze, he: הדרוזי}
      - id: other
        label: {en: not registered as Jewish or Arab, he: לא רשום כיהודי או כערבי, he_f: לא רשומה כיהודייה או כערבייה}
        attrs:
          noun: {en: non-Jewish immigrant-family, he: של משפחות עולים שאינם רשומים כיהודים}

  - id: age
    type: table
    numeric: true
    parents: [group, sex, age_band]
    label: {en: Age, he: גיל}
    file: cpts/age.csv
    doc: docs/methodology/frame.md
    sources: [cbs_abstract_2025_population]
    domain_file: domains/age.csv

  - id: birth_cohort
    type: lookup
    parent: age
    hidden: true
    label: {en: Birth cohort, he: שנתון לידה}
    file: lookups/birth_cohort.csv
    domain_file: domains/birth_cohort.csv
    doc: docs/methodology/first_name.md
    sources: [cbs_names]

  - id: religiosity
    type: table
    parents: [group, sex, age_band, locality_profile]
    backoff: [locality_profile]
    label: {en: Religiosity (self-defined), he: מידת דתיות (הגדרה עצמית)}
    file: cpts/religiosity.csv
    doc: docs/methodology/religiosity.md
    sources: [cbs_abstract_2025_attitudes, cbs_social_survey_2024, ines_2022, cec_knesset25]
    values:
      - id: haredi
        label: {en: Ultra-Orthodox (Haredi), he: חרדי, he_f: חרדית}
        attrs:
          self: {en: "ultra-Orthodox (Haredi)", he: ""}
      - id: dati
        label: {en: Religious (Dati), he: דתי, he_f: דתייה}
        attrs:
          self: {en: "religious (Dati)", he: ""}
      - id: masorti_dati
        label: {en: Traditional-religious, he: מסורתי-דתי, he_f: מסורתית-דתייה}
        attrs:
          self: {en: "traditional-religious", he: ""}
      - id: masorti
        label: {en: Traditional, he: מסורתי, he_f: מסורתית}
        attrs:
          self: {en: "traditional", he: ""}
      - id: hiloni
        label: {en: Secular, he: חילוני, he_f: חילונית}
        attrs:
          self: {en: "secular", he: ""}
      - id: very_religious
        label: {en: Very religious, he: דתי מאוד, he_f: דתייה מאוד}
        attrs:
          self: {en: "very religious", he: ""}
      - id: religious
        label: {en: Religious, he: דתי, he_f: דתייה}
        attrs:
          self: {en: "religious", he: ""}
      - id: not_so_religious
        label: {en: Not so religious, he: לא כל כך דתי, he_f: לא כל כך דתייה}
        attrs:
          self: {en: "not so religious", he: ""}
      - id: not_religious
        label: {en: Not religious, he: לא דתי, he_f: לא דתייה}
        attrs:
          self: {en: "not religious", he: ""}

  - id: first_name
    type: table
    parents: [group, sex, birth_cohort]
    label: {en: First name, he: שם פרטי}
    file: cpts/first_name.csv
    domain_file: domains/first_name.csv
    doc: docs/methodology/first_name.md
    sources: [cbs_names, igra_registry_names]

  - id: immigrant_bucket
    type: lookup
    parent: locality
    hidden: true
    label: {en: Share of 1990+ immigrants in the locality, he: שיעור עולי 1990 ואילך ביישוב}
    file: lookups/immigrant_bucket.csv
    domain_file: domains/immigrant_bucket.csv
    doc: docs/methodology/origin.md
    sources: [cbs_local_authorities_2024]

  - id: origin
    type: table
    parents: [group, age_band, religiosity, immigrant_bucket]
    backoff: [immigrant_bucket, religiosity, age_band]
    label: {en: Origin, he: מוצא}
    file: cpts/origin.csv
    domain_file: domains/origin.csv
    doc: docs/methodology/origin.md
    sources: [cbs_abstract_2021_origin, cbs_abstract_2025_population, ines_2022, cbs_local_authorities_2024]

  - id: generation
    type: lookup
    parent: origin
    label: {en: Generation in Israel, he: דור בישראל}
    file: lookups/generation.csv
    doc: docs/methodology/origin.md
    sources: [cbs_abstract_2021_origin]
    values:
      - {id: immigrant, label: {en: Immigrant (born abroad), he: עולה (יליד חו"ל), he_f: עולה (ילידת חו"ל)}}
      - {id: second_gen, label: {en: Second generation (Israeli-born to an immigrant father), he: דור שני בישראל}}
      - {id: third_gen, label: {en: Third generation or more, he: דור שלישי ומעלה בישראל}}
      - {id: native, label: {en: Native (Arab or Druze citizen), he: ילידי (אזרח ערבי או דרוזי), he_f: ילידית (אזרחית ערבייה או דרוזית)}}

  - id: ancestry
    type: table
    parents: [origin, religiosity]
    backoff: [religiosity, origin]
    label: {en: "Ancestry (self-identified, third generation)", he: "מוצא עדתי (הגדרה עצמית, דור שלישי)"}
    file: cpts/ancestry.csv
    doc: docs/methodology/origin.md
    sources: [ines_2022]
    values:
      - {id: ashkenazi, label: {en: of Ashkenazi descent, he: ממוצא אשכנזי}}
      - {id: mizrahi, label: {en: of Mizrahi or Sephardi descent, he: ממוצא מזרחי או ספרדי}}
      - {id: mixed, label: {en: of mixed Ashkenazi and Mizrahi descent, he: "ממוצא מעורב, אשכנזי ומזרחי"}}
      - {id: israeli_only, label: {en: identifying simply as Israeli, he: המגדיר את עצמו פשוט ישראלי, he_f: המגדירה את עצמה פשוט ישראלית}}
      - {id: not_applicable, label: {en: not applicable, he: לא רלוונטי}}

  - id: birth_region
    type: lookup
    parent: origin
    hidden: true
    label: {en: Continent of birth, he: יבשת לידה}
    file: lookups/birth_region.csv
    doc: docs/methodology/origin.md
    sources: [cbs_abstract_2021_origin]
    values:
      - {id: israel, label: {en: Israel, he: ישראל}}
      - {id: europe_america, label: {en: Europe or the Americas, he: אירופה או אמריקה}}
      - {id: asia, label: {en: Asia, he: אסיה}}
      - {id: africa, label: {en: Africa, he: אפריקה}}

  - id: marital_status
    type: table
    parents: [group, religiosity, sex, age_band]
    backoff: [religiosity]
    label: {en: Marital status, he: מצב משפחתי}
    file: cpts/marital_status.csv
    doc: docs/methodology/marital_status.md
    sources: [cbs_social_survey_2024, cbs_abstract_2025_marriages, cbs_abstract_2025_population]
    values:
      - {id: married, label: {en: married, he: נשוי, he_f: נשואה}}
      - {id: divorced, label: {en: divorced, he: גרוש, he_f: גרושה}}
      - {id: widowed, label: {en: widowed, he: אלמן, he_f: אלמנה}}
      - {id: never_married, label: {en: single, he: רווק, he_f: רווקה}}

  - id: children
    type: table
    parents: [group, religiosity, sex, age_band, marital_status]
    backoff: [religiosity]
    label: {en: Number of children, he: מספר ילדים}
    file: cpts/children.csv
    doc: docs/methodology/children.md
    sources: [cbs_social_survey_2024]
    values:
      - id: "0"
        label: {en: none, he: אין}
        attrs:
          family: {en: no children, he: ואין לו ילדים, he_f: ואין לה ילדים}
      - id: "1"
        label: {en: "1", he: "1"}
        attrs:
          family: {en: one child, he: ואב לילד אחד, he_f: ואם לילד אחד}
      - id: "2"
        label: {en: "2", he: "2"}
        attrs:
          family: {en: two children, he: ואב לשני ילדים, he_f: ואם לשני ילדים}
      - id: "3"
        label: {en: "3", he: "3"}
        attrs:
          family: {en: three children, he: ואב לשלושה ילדים, he_f: ואם לשלושה ילדים}
      - id: "4"
        label: {en: "4", he: "4"}
        attrs:
          family: {en: four children, he: ואב לארבעה ילדים, he_f: ואם לארבעה ילדים}
      - id: "5"
        label: {en: "5", he: "5"}
        attrs:
          family: {en: five children, he: ואב לחמישה ילדים, he_f: ואם לחמישה ילדים}
      - id: "6"
        label: {en: "6", he: "6"}
        attrs:
          family: {en: six children, he: ואב לשישה ילדים, he_f: ואם לשישה ילדים}
      - id: "7"
        label: {en: 7 or more, he: 7 ומעלה}
        attrs:
          family: {en: seven or more children, he: ואב לשבעה ילדים או יותר, he_f: ואם לשבעה ילדים או יותר}

  - id: education
    type: table
    parents: [group, religiosity, sex, age_band, birth_region]
    backoff: [religiosity]
    label: {en: Highest diploma, he: התעודה הגבוהה ביותר}
    file: cpts/education.csv
    doc: docs/methodology/education.md
    sources: [cbs_social_survey_2024]
    values:
      - id: no_diploma
        label: {en: no diploma, he: ללא תעודה}
        attrs:
          has: {en: no formal diploma, he: ללא תעודת סיום}
      - id: primary
        label: {en: elementary or middle school, he: בית ספר יסודי או חטיבת ביניים}
        attrs:
          has: {en: an elementary or middle-school certificate, he: בעל תעודת סיום של בית ספר יסודי או חטיבת ביניים, he_f: בעלת תעודת סיום של בית ספר יסודי או חטיבת ביניים}
      - id: secondary
        label: {en: high school without matriculation, he: תיכון ללא בגרות}
        attrs:
          has: {en: a high-school diploma without matriculation (bagrut), he: בעל תעודת סיום תיכון ללא בגרות, he_f: בעלת תעודת סיום תיכון ללא בגרות}
      - id: bagrut
        label: {en: matriculation (bagrut), he: תעודת בגרות}
        attrs:
          has: {en: a matriculation certificate (bagrut), he: בעל תעודת בגרות, he_f: בעלת תעודת בגרות}
      - id: post_secondary
        label: {en: post-secondary non-academic diploma, he: תעודה על-תיכונית לא אקדמית}
        attrs:
          has: {en: a post-secondary non-academic diploma, he: בעל תעודה על-תיכונית שאינה אקדמית, he_f: בעלת תעודה על-תיכונית שאינה אקדמית}
      - id: ba
        label: {en: bachelor's degree, he: תואר ראשון}
        attrs:
          has: {en: a bachelor's degree, he: בעל תואר ראשון, he_f: בעלת תואר ראשון}
      - id: ma
        label: {en: master's degree, he: תואר שני}
        attrs:
          has: {en: a master's degree, he: בעל תואר שני, he_f: בעלת תואר שני}
      - id: phd
        label: {en: doctorate, he: תואר שלישי}
        attrs:
          has: {en: a doctorate, he: בעל תואר שלישי (דוקטורט), he_f: בעלת תואר שלישי (דוקטורט)}
      - id: other_diploma
        label: {en: other diploma, he: תעודה אחרת}
        attrs:
          has: {en: another kind of diploma, he: בעל תעודה אחרת, he_f: בעלת תעודה אחרת}

  - id: military_service
    type: table
    parents: [group, religiosity, sex, age_band, birth_region]
    backoff: [religiosity]
    label: {en: Military or national service, he: שירות צבאי או לאומי}
    file: cpts/military_service.csv
    doc: docs/methodology/military_service.md
    sources: [cbs_social_survey_2024]
    values:
      - id: idf
        label: {en: served in the IDF, he: 'שירת בצה"ל', he_f: 'שירתה בצה"ל'}
      - id: national_service
        label: {en: did national or civic service, he: עשה שירות לאומי-אזרחי, he_f: עשתה שירות לאומי-אזרחי}
      - id: none
        label: {en: did not serve, he: לא שירת, he_f: לא שירתה}

  - id: in_service
    type: table
    parents: [age, sex, military_service]
    backoff: [age, sex, military_service]
    hidden: true
    label: {en: Currently in compulsory service, he: בשירות חובה כעת}
    file: cpts/in_service.csv
    doc: docs/methodology/military_service.md
    sources: [cbs_social_survey_2024]
    values:
      - {id: "no", label: {en: "no", he: לא}}
      - {id: idf, label: {en: serving in the IDF, he: 'משרת בצה"ל', he_f: 'משרתת בצה"ל'}}
      - {id: national_service, label: {en: in national service, he: בשירות לאומי}}

  - id: labour_status
    type: table
    parents: [in_service, group, religiosity, sex, age_band, education]
    backoff: [religiosity, education, group, sex, age_band]
    label: {en: Labour-force status, he: מצב בכוח העבודה}
    file: cpts/labour_status.csv
    doc: docs/methodology/labour_status.md
    sources: [cbs_social_survey_2024]
    values:
      - {id: employed, label: {en: employed, he: מועסק, he_f: מועסקת}}
      - {id: unemployed, label: {en: unemployed (looking for work), he: מובטל (מחפש עבודה), he_f: מובטלת (מחפשת עבודה)}}
      - {id: not_in_labour_force, label: {en: not working and not looking for work, he: אינו עובד ואינו מחפש עבודה, he_f: אינה עובדת ואינה מחפשת עבודה}}
      - {id: retired, label: {en: retired, he: פנסיונר, he_f: פנסיונרית}}
      - {id: compulsory_service, label: {en: in compulsory military or national service, he: בשירות חובה צבאי או לאומי}}

  - id: occupation
    type: table
    parents: [labour_status, group, religiosity, sex, education]
    backoff: [religiosity, education, sex, group, labour_status]
    label:
